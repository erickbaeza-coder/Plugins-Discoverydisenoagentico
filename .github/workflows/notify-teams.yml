name: Notificar Teams â Nueva versiÃ³n del plugin

on:
  release:
    types: [published]

jobs:
  notify:
    name: Enviar notificaciÃ³n a Teams
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main

      - name: Actualizar version.json
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          CLEAN_VERSION=$(echo "$VERSION" | sed 's/^v//')
          DATE=$(date +%Y-%m-%d)
          NOTES="${{ github.event.release.body }}"
          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/${VERSION}/discovery-agentico-${CLEAN_VERSION}.plugin"

          python3 << PYEOF
          import json

          with open('version.json', 'r') as f:
              data = json.load(f)

          data['version'] = '${CLEAN_VERSION}'
          data['release_date'] = '${DATE}'
          data['changelog'] = """${NOTES}"""
          data['download_url'] = '${DOWNLOAD_URL}'

          with open('version.json', 'w') as f:
              json.dump(data, f, indent=2, ensure_ascii=False)

          print(f"version.json actualizado a v${CLEAN_VERSION}")
          PYEOF

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.json
          git diff --staged --quiet || git commit -m "chore: bump version.json to ${VERSION} [skip ci]"
          git push

      - name: Enviar notificaciÃ³n a Teams (Power Automate)
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          CLEAN_VERSION=$(echo "$VERSION" | sed 's/^v//')
          RELEASE_URL="${{ github.event.release.html_url }}"
          NOTES="${{ github.event.release.body }}"
          REPO="${{ github.repository }}"
          DOWNLOAD_URL="https://github.com/${REPO}/releases/download/${VERSION}/discovery-agentico-${CLEAN_VERSION}.plugin"

          # Construir Adaptive Card compatible con Power Automate Workflows
          PAYLOAD=$(python3 << PYEOF
          import json

          version = "${CLEAN_VERSION}"
          release_url = "${RELEASE_URL}"
          download_url = "${DOWNLOAD_URL}"
          notes = """${NOTES}""".strip() or "Ver release notes en GitHub."
          repo = "${REPO}"

          # Truncar notas si son muy largas
          if len(notes) > 300:
              notes = notes[:297] + "..."

          payload = {
              "type": "message",
              "attachments": [
                  {
                      "contentType": "application/vnd.microsoft.card.adaptive",
                      "contentUrl": None,
                      "content": {
                          "\$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
                          "type": "AdaptiveCard",
                          "version": "1.4",
                          "body": [
                              {
                                  "type": "Container",
                                  "style": "emphasis",
                                  "items": [
                                      {
                                          "type": "ColumnSet",
                                          "columns": [
                                              {
                                                  "type": "Column",
                                                  "width": "auto",
                                                  "items": [
                                                      {
                                                          "type": "TextBlock",
                                                          "text": "ð",
                                                          "size": "ExtraLarge"
                                                      }
                                                  ]
                                              },
                                              {
                                                  "type": "Column",
                                                  "width": "stretch",
                                                  "items": [
                                                      {
                                                          "type": "TextBlock",
                                                          "text": f"discovery-agentico v{version}",
                                                          "weight": "Bolder",
                                                          "size": "Large",
                                                          "wrap": True
                                                      },
                                                      {
                                                          "type": "TextBlock",
                                                          "text": "Nueva versiÃ³n disponible",
                                                          "isSubtle": True,
                                                          "spacing": "None"
                                                      }
                                                  ]
                                              }
                                          ]
                                      }
                                  ]
                              },
                              {
                                  "type": "Container",
                                  "items": [
                                      {
                                          "type": "TextBlock",
                                          "text": "**Â¿QuÃ© hay de nuevo?**",
                                          "weight": "Bolder",
                                          "spacing": "Medium"
                                      },
                                      {
                                          "type": "TextBlock",
                                          "text": notes,
                                          "wrap": True,
                                          "spacing": "Small"
                                      },
                                      {
                                          "type": "TextBlock",
                                          "text": "**CÃ³mo actualizar:** Descarga el .plugin â Claude Desktop â ConfiguraciÃ³n â Plugins â Instalar",
                                          "wrap": True,
                                          "isSubtle": True,
                                          "spacing": "Medium",
                                          "size": "Small"
                                      }
                                  ]
                              }
                          ],
                          "actions": [
                              {
                                  "type": "Action.OpenUrl",
                                  "title": "ð¥ Descargar plugin",
                                  "url": release_url,
                                  "style": "positive"
                              },
                              {
                                  "type": "Action.OpenUrl",
                                  "title": "ð Ver release notes",
                                  "url": release_url
                              }
                          ],
                          "msteams": {
                              "width": "Full"
                          }
                      }
                  }
              ]
          }

          print(json.dumps(payload, ensure_ascii=False))
          PYEOF
          )

          echo "Enviando notificaciÃ³n a Teams..."

          HTTP_STATUS=$(curl -s -o /tmp/teams_response.txt -w "%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "$TEAMS_WEBHOOK_URL")

          RESPONSE=$(cat /tmp/teams_response.txt)
          echo "HTTP Status: $HTTP_STATUS"
          echo "Response: $RESPONSE"

          if [ "$HTTP_STATUS" = "200" ] || [ "$HTTP_STATUS" = "202" ] || [ "$HTTP_STATUS" = "204" ]; then
            echo "â NotificaciÃ³n enviada exitosamente a Teams"
          else
            echo "â Error al enviar notificaciÃ³n (HTTP $HTTP_STATUS)"
            echo "Respuesta: $RESPONSE"
            exit 1
          fi
