name: Notificar Teams - Nueva version del plugin

on:
  release:
    types: [published]

jobs:
  notify:
    name: Enviar notificacion a Teams
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main

      - name: Actualizar version.json
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          CLEAN="${VERSION#v}"
          DATE=$(date +%Y-%m-%d)
          BODY=$(cat << 'ENDBODY'
${{ github.event.release.body }}
ENDBODY
          )
          python3 - << PYEOF
import json, os
with open("version.json") as f: d = json.load(f)
d["version"] = os.environ["CLEAN"]
d["release_date"] = os.environ["DATE"]
d["changelog"] = os.environ.get("BODY", "")
d["download_url"] = "https://github.com/" + os.environ["REPO"] + "/releases/download/" + os.environ["VERSION"] + "/discovery-agentico-" + os.environ["CLEAN"] + ".plugin"
with open("version.json", "w") as f: json.dump(d, f, indent=2, ensure_ascii=False)
print("version.json updated to", d["version"])
PYEOF
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.json
          git diff --staged --quiet || git commit -m "chore: bump version.json to ${VERSION} [skip ci]"
          git push origin main
        env:
          VERSION: ${{ github.event.release.tag_name }}
          CLEAN: ${{ github.event.release.tag_name }}
          DATE: ${{ github.event.release.published_at }}
          REPO: ${{ github.repository }}

      - name: Enviar notificacion a Teams
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          TITLE="${{ github.event.release.name }}"
          REPO_URL="https://github.com/${{ github.repository }}/releases/tag/${VERSION}"
          CLEAN="${VERSION#v}"
          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/${VERSION}/discovery-agentico-${CLEAN}.plugin"
          PAYLOAD='{"type":"message","attachments":[{"contentType":"application/vnd.microsoft.card.adaptive","content":{"type":"AdaptiveCard","version":"1.4","body":[{"type":"TextBlock","text":"Nueva version disponible","size":"Large","weight":"Bolder","color":"Accent"},{"type":"TextBlock","text":"'${TITLE}'","wrap":true},{"type":"ActionSet","actions":[{"type":"Action.OpenUrl","title":"Descargar plugin","url":"'${DOWNLOAD_URL}'"},{"type":"Action.OpenUrl","title":"Ver en GitHub","url":"'${REPO_URL}'"}]}]}}]}'
          HTTP=$(curl -s -o /tmp/tr.txt -w "%{http_code}" -X POST -H "Content-Type: application/json" -d "$PAYLOAD" "$TEAMS_WEBHOOK_URL")
          echo "Status: $HTTP"; cat /tmp/tr.txt
          [[ "$HTTP" == "200" || "$HTTP" == "202" || "$HTTP" == "204" ]] && echo "OK" || (echo "Error $HTTP"; exit 1)
