name: Notificar Teams – Nueva versión del plugin

on:
  release:
    types: [published]

jobs:
  notify:
    name: Enviar notificación a Teams
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main

      - name: Actualizar version.json
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          CLEAN_VERSION=$(echo "$VERSION" | sed 's/^v//')
          DATE=$(date +%Y-%m-%d)
          NOTES="${{ github.event.release.body }}"
          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/${VERSION}/discovery-agentico-${CLEAN_VERSION}.plugin"

          python3 << PYEOF
import json

with open('version.json', 'r') as f:
    data = json.load(f)

import os
data['version'] = os.environ.get('CLEAN_VERSION', data['version'])
data['release_date'] = os.environ.get('DATE', data['release_date'])
data['changelog'] = os.environ.get('NOTES', '')
data['download_url'] = os.environ.get('DOWNLOAD_URL', data['download_url'])

with open('version.json', 'w') as f:
    json.dump(data, f, indent=2, ensure_ascii=False)
print(f"version.json actualizado a {data['version']}")
PYEOF

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.json
          git commit -m "chore: bump version.json to ${VERSION} [skip ci]" || echo "No changes to commit"
          git push origin main

        env:
          CLEAN_VERSION: ${{ github.event.release.tag_name }}
          DATE: ${{ github.event.release.published_at }}
          NOTES: ${{ github.event.release.body }}
          DOWNLOAD_URL: https://github.com/${{ github.repository }}/releases/download/${{ github.event.release.tag_name }}/discovery-agentico-${{ github.event.release.tag_name }}.plugin

      - name: Enviar notificación a Teams (Power Automate)
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          TITLE="${{ github.event.release.name }}"
          NOTES="${{ github.event.release.body }}"
          REPO_URL="https://github.com/${{ github.repository }}/releases/tag/${VERSION}"
          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/${VERSION}/discovery-agentico-${VERSION}.plugin"

          PAYLOAD=$(cat <<EOF
          {
            "type": "message",
            "attachments": [
              {
                "contentType": "application/vnd.microsoft.card.adaptive",
                "content": {
                  "type": "AdaptiveCard",
                  "version": "1.4",
                  "body": [
                    {
                      "type": "TextBlock",
                      "text": "🚀 Nueva versión del plugin disponible",
                      "size": "Large",
                      "weight": "Bolder",
                      "color": "Accent"
                    },
                    {
                      "type": "TextBlock",
                      "text": "${TITLE}",
                      "size": "Medium",
                      "weight": "Bolder"
                    },
                    {
                      "type": "TextBlock",
                      "text": "${NOTES}",
                      "wrap": true
                    },
                    {
                      "type": "ActionSet",
                      "actions": [
                        {
                          "type": "Action.OpenUrl",
                          "title": "📥 Descargar plugin",
                          "url": "${DOWNLOAD_URL}"
                        },
                        {
                          "type": "Action.OpenUrl",
                          "title": "🔗 Ver release en GitHub",
                          "url": "${REPO_URL}"
                        }
                      ]
                    }
                  ]
                }
              }
            ]
          }
EOF
          )

          HTTP_STATUS=$(curl -s -o /tmp/teams_response.txt -w "%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "$TEAMS_WEBHOOK_URL")

          echo "Teams response status: $HTTP_STATUS"
          cat /tmp/teams_response.txt

          if [[ "$HTTP_STATUS" == "200" || "$HTTP_STATUS" == "202" || "$HTTP_STATUS" == "204" ]]; then
            echo "✅ Notificación enviada correctamente"
          else
            echo "❌ Error al enviar la notificación: HTTP $HTTP_STATUS"
            exit 1
          fi
