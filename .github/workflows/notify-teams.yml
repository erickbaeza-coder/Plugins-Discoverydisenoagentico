name: Notificar Teams - Nueva version del plugin

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  notify:
    name: Enviar notificacion a Teams
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main

      - name: Actualizar version.json
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          CLEAN="${VERSION#v}"
          REPO="${{ github.repository }}"
          URL="https://github.com/${REPO}/releases/download/${VERSION}/discovery-agentico-${CLEAN}.plugin"
          jq --arg v "$CLEAN" --arg d "$(date +%Y-%m-%d)" --arg u "$URL" '.version=$v | .release_date=$d | .download_url=$u' version.json > /tmp/vj.json && mv /tmp/vj.json version.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.json
          git diff --staged --quiet || git commit -m "chore: bump version.json to ${VERSION} [skip ci]"
          git push origin main

      - name: Enviar notificacion a Teams
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          TITLE="${{ github.event.release.name }}"
          REPO="${{ github.repository }}"
          CLEAN="${VERSION#v}"
          REPO_URL="https://github.com/${REPO}/releases/tag/${VERSION}"
          DOWNLOAD_URL="https://github.com/${REPO}/releases/download/${VERSION}/discovery-agentico-${CLEAN}.plugin"
          PAYLOAD="{\"type\":\"message\",\"attachments\":[{\"contentType\":\"application/vnd.microsoft.card.adaptive\",\"content\":{\"type\":\"AdaptiveCard\",\"version\":\"1.4\",\"body\":[{\"type\":\"TextBlock\",\"text\":\"Nueva version disponible: ${VERSION}\",\"size\":\"Large\",\"weight\":\"Bolder\"},{\"type\":\"TextBlock\",\"text\":\"${TITLE}\",\"wrap\":true},{\"type\":\"ActionSet\",\"actions\":[{\"type\":\"Action.OpenUrl\",\"title\":\"Descargar\",\"url\":\"${DOWNLOAD_URL}\"},{\"type\":\"Action.OpenUrl\",\"title\":\"GitHub\",\"url\":\"${REPO_URL}\"}]}]}}]}"
          HTTP=$(curl -s -o /tmp/tr.txt -w "%{http_code}" -X POST -H "Content-Type: application/json" -d "$PAYLOAD" "$TEAMS_WEBHOOK_URL")
          echo "Teams HTTP status: $HTTP"
          cat /tmp/tr.txt
          [[ "$HTTP" == "200" || "$HTTP" == "202" || "$HTTP" == "204" ]] && echo "Notificacion enviada OK" || (echo "Error: $HTTP"; exit 1)
